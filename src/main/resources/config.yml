# tokaSigns 設定檔（繁體中文註解）
# 修改後需重新啟動伺服器才會套用。

# 顯示語言，決定 lang/<語言>.yml 的文字。目前提供：zh-TW（繁體中文）。
# 伺服器擁有者可在 plugins/tokaSigns/lang/ 放同名檔案覆蓋個別文字。
language: zh-TW

# 告示牌登記資料的儲存方式。
storage:
  # 可填：sqlite（預設）、json、yaml。檔案位於 plugins/tokaSigns/storage/<backend>/。
  # 改設定不會自動搬移既有資料；切換前請先備份並確認讀回結果。
  backend: sqlite

actions:
  # 是否由本插件接管告示牌事件（點擊、建立、編輯、破壞）。可填：true、false。
  # 沒有註冊保護政策時，以權限為準；沒有業務 provider 的牌子不會有動作。
  enabled: true

messages:
  # 告示牌無法使用時，頂部訊息區（tokaDisplay）提示的停留秒數，可填 1 到 60 的整數。未安裝 tokaDisplay 時改用聊天室提示。
  use-failed-seconds: 5

# 功能牌外觀。
signs:
  # 是否讓牌面文字在暗處保持清晰，預設開啟。
  glow: true

# 維護工作（/sign check、/sign refresh、/sign repair）每個 tick 的處理量。
# 實際數量會依 TPS、tick 使用率與近期耗時自動調整；下列數值是上限，不是固定每 tick 筆數。
maintenance:
  # 自動清理：定時檢查已載入區塊裡的告示牌資料，牌子已經不在的資料（被爆炸、活塞、指令、還原世界等弄掉）會自動移除，不需要人管。
  # 做法：只看已載入的區塊；同一筆資料連續幾次檢查都沒有牌子才會移除；位置上還是告示牌方塊（只是資料晚到）絕不移除；
  # 一次要移除的數量超過上限就一筆都不動（通常是世界被還原或損壞，需要人工看）；移除的資料都寫在 plugins/tokaSigns/removed-signs.log，可以照內容補回。
  auto-clean:
    # 是否啟用，可填 true 或 false，預設 true
    enabled: true
    # 兩次檢查之間隔幾分鐘，可填 1 以上的整數，預設 10
    interval-minutes: 10
    # 連續幾次檢查都沒有牌子才移除，可填 2 以上的整數，預設 3
    confirm-passes: 3
    # 一次檢查最多移除幾筆，超過就整批不動並在後台提醒，可填 1 以上的整數，預設 20
    max-per-pass: 20
  # 一般模式（不帶 --force，只處理已載入區塊的告示牌）
  normal:
    # 每個 tick 最多處理幾筆，可填 1 到 128 的整數
    max-records: 32
    # 每個 tick 最多花費的毫秒數，可填 0.1 到 10 的數字
    budget-ms: 2
    # 伺服器 TPS 低於此值時暫停處理，可填 0 到 20 的數字
    min-tps: 17
  # 強制模式（帶 --force，會載入既有區塊，成本較高故預設較保守）
  force:
    # 每個 tick 最多處理幾筆，可填 1 到 128 的整數
    max-records: 2
    # 每個 tick 最多花費的毫秒數，可填 0.1 到 10 的數字
    budget-ms: 1
    # 伺服器 TPS 低於此值時暫停處理，可填 0 到 20 的數字
    min-tps: 18
